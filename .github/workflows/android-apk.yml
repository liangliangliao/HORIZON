name: Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: android-apk-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Free disk space for Unity test image
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          dotnet: true
          haskell: true
          tool-cache: true
          large-packages: false
          docker-images: false
          swap-storage: true

      - name: Run rules and playable UX tests with visual capture
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.22f1
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          customParameters: -force-glcore

      - name: Upload EditMode results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HORIZON-EditMode-Results
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify Unity portrait previews
        shell: bash
        run: |
          test -s artifacts/visuals/01-board.png
          test -s artifacts/visuals/02-action-result.png
          test -s artifacts/visuals/03-echo-result.png
          test -s artifacts/visuals/04-future-station.png
          test -s artifacts/visuals/05-deadline.png
          test -s artifacts/visuals/07-archive-detail.png
          test -s artifacts/visuals/08-branch-planner.png
          test -s artifacts/visuals/09-causal-network.png
          test -s artifacts/visuals/10-share-story.png
          test -s artifacts/visuals/11-rare-moment.png
          test -s artifacts/visuals/12-range-forecast.png
          test -s artifacts/visuals/13-cascade-merge.png
          test -s artifacts/visuals/14-future-self-reveal.png

      - name: Decode and verify actual Unity GIF exports
        shell: bash
        run: |
          python -m pip install pillow==12.3.0
          python tools/verify_timeline_exports.py

      - name: Upload Unity portrait previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HORIZON-Unity-Portrait-Previews
          path: artifacts/visuals/
          if-no-files-found: ignore
          retention-days: 14

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Check Unity activation secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" || ( -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ) ]]; then
            echo '::error title=Unity activation required::Set UNITY_EMAIL and UNITY_PASSWORD, plus UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro), in repository Actions secrets.'
            exit 1
          fi

      - name: Free disk space for Unity Android image
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          dotnet: true
          haskell: true
          tool-cache: true
          large-packages: false
          docker-images: false
          swap-storage: true

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.22f1
          targetPlatform: Android
          buildMethod: Horizon.Editor.AndroidBuild.Build
          androidExportType: androidPackage

      - name: Verify APK output
        shell: bash
        run: |
          find build -type f -name '*.apk' -printf '%p (%s bytes)\n' | tee /tmp/horizon-apks.txt
          test -s /tmp/horizon-apks.txt
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apks = list(Path('build').rglob('*.apk'))
          assert apks, 'No APK produced'
          for apk in apks:
              with zipfile.ZipFile(apk) as archive:
                  entries = set(archive.namelist())
                  for abi in ('armeabi-v7a', 'arm64-v8a'):
                      for library in ('libunity.so', 'libil2cpp.so'):
                          assert f'lib/{abi}/{library}' in entries, f'{apk}: missing {abi}/{library}'
              print(f'{apk}: ARMv7 and ARM64 verified')
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HORIZON-Android-APK
          path: build/**/*.apk
          if-no-files-found: error
          retention-days: 14
