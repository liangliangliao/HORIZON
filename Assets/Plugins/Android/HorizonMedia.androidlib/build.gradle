apply plugin: 'com.android.library'

android {
    namespace 'com.horizon.media'
    compileSdkVersion 32

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 32
        consumerProguardFiles 'consumer-rules.pro'
    }

    // This Unity Android library uses the Eclipse-style src/ layout.
    // Gradle's default src/main/java would silently exclude the JNI classes.
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
